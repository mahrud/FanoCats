# Setup
title:               Learn Macaulay2
tagline:             a Software System for Research in Algebraic Geometry
description:         >- # this means to ignore newlines until "url:"
  Macaulay2 is a software system devoted to supporting research in algebraic
  geometry and commutative algebra.
url:                 https://mahrud.github.io
baseurl:             '/LearnM2' # the subpath of your site, e.g. /blog
# gtag:                '' # Google Analytics Tag

# Color scheme. Options: red, orange, magenta, cyan, blue, brown
color-scheme:

# Permalinks
permalink: pretty
permalink: /:title/

# Set encoding to UTF-8
encoding: utf-8

# Collections for entries
collections:
  examples:
    output: true
  packages:
    output: true

# Markdown specs
markdown: kramdown

kramdown:
  input: TeXdown
  # we use KaTeX
  math_engine: null
  # enable parsing Markdown inside html blocks
  parse_block_html: true
  # ↩ followed by a symbol to prevent emoji conversion
  footnote_backlink: "&#x21a9;&#xfe0e;"
  # don't make typographical conversions like >> to »
  gfm_quirks: [paragraph_end, no_auto_typographic]
  # disables syntax highlighter
  syntax_highlighter_opts:
    disable: "true"

# Exclusions from the final site
exclude:
  - TODO
  - README.md
  - LICENSE.md
  - proof.gemspec
  - Makefile
  - _cache
  - generate-json.m2

# Theme
remote_theme: "mahrud/proof"
